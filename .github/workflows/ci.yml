name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: pnpm requires a committed pnpm-lock.yaml — re-enable once
          # one exists (run `pnpm install` locally and commit the lockfile).

      - name: Install dependencies
        # No pnpm-lock.yaml is committed yet (scaffolded without a local
        # Node/pnpm install available) — switch this to --frozen-lockfile
        # once a real lockfile is committed, for reproducible installs.
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Deploy jobs only run on push to main, after CI passes, and only if
  # VERCEL_TOKEN is configured as a repo secret. Each app is an independent
  # Vercel project (Root Directory set per-project to its apps/* folder),
  # deployed to its own *.vercel.app URL (no custom domain configured — see
  # MVBB-Roadmap for when that changes).
  #
  # Deploy MUST run from the repo root, not from inside apps/<name> — Vercel
  # needs the whole pnpm workspace uploaded to resolve the `workspace:*`
  # deps in each app's package.json (e.g. @mvbb/ui). Which project a given
  # job targets is selected via VERCEL_PROJECT_ID, not by cwd.
  deploy-admin:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/admin to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_pYhnU6kGhub42BGS80czFWzXMWJI
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-customer:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/customer to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_rnDnX3ywQKiS5qi3hp5eZyD1qRA7
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-driver:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/driver to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_zStUxvAUkGC5xJ7fmVZW9wbykaLb
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
