name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Every PR title and every commit message on the branch must start with a
  # ticket prefix like "[MVBB-1] " — mirrors the [MVBB-N] convention used on
  # GitHub issue titles. Required check on main (see branch protection) — a
  # PR that doesn't follow this cannot merge.
  ticket-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title starts with a ticket ID
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -qE '^\[MVBB-[0-9]+\] ' || {
            echo "::error::PR title must start with a ticket ID like '[MVBB-1] '. Got: $PR_TITLE"
            exit 1
          }

      - name: Check every commit message starts with a ticket ID
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          missing=0
          while IFS= read -r line; do
            if ! echo "$line" | grep -qE '^\[MVBB-[0-9]+\] '; then
              echo "::error::Commit must start with a ticket ID like '[MVBB-1] ': $line"
              missing=1
            fi
          done < <(git log --no-merges --format=%s "$base".."${{ github.event.pull_request.head.sha }}")
          exit $missing

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Using npm workspaces (not pnpm) — pnpm's registry client hit a
        # persistent ERR_INVALID_THIS bug against Vercel's build network
        # (reproduced on both Node 20.x and 24.x, and via corepack too), so
        # npm is the install/build tool for this monorepo until that's
        # resolved upstream.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  # Skips itself (green, non-blocking) until SONAR_TOKEN is added as a repo
  # secret (see sonar-project.properties for the org/project key to fill in
  # once the SonarCloud project exists). Job-level `if` can't reference
  # `secrets` directly, so the check happens in a step instead.
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Sonar token
        id: check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarCloud Scan
        if: steps.check.outputs.skip == 'false'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deploy jobs only run on push to main, after CI passes, and only if
  # VERCEL_TOKEN is configured as a repo secret. Each app is an independent
  # Vercel project (Root Directory set per-project to its apps/* folder),
  # deployed to its own *.vercel.app URL (no custom domain configured — see
  # MVBB-Roadmap for when that changes).
  #
  # Deploy MUST run from the repo root, not from inside apps/<name> — Vercel
  # needs the whole npm workspace uploaded to resolve each app's local
  # @mvbb/* deps (see root package.json "workspaces"). Which project a
  # given job targets is selected via VERCEL_PROJECT_ID, not by cwd.
  deploy-admin:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/admin to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_pYhnU6kGhub42BGS80czFWzXMWJI
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-customer:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/customer to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_rnDnX3ywQKiS5qi3hp5eZyD1qRA7
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-driver:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy apps/driver to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_u1kXQBF80ZglmGhfNdDlhY9E
          VERCEL_PROJECT_ID: prj_zStUxvAUkGC5xJ7fmVZW9wbykaLb
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
