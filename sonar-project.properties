# SONAR_TOKEN still needs to be added as a repo secret to activate the
# "sonar" job in .github/workflows/ci.yml — until then it skips itself.
sonar.organization=mvbb-business
sonar.projectKey=MVBB-Business_MVBB-POC

sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/*.test.ts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts
