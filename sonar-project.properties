# Fill these in once the SonarCloud project exists (sonarcloud.io -> import
# MVBB-Business/MVBB-POC), then add SONAR_TOKEN as a repo secret to activate
# the "sonar" job in .github/workflows/ci.yml.
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG_KEY
sonar.projectKey=REPLACE_WITH_SONARCLOUD_PROJECT_KEY

sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/*.test.ts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts
